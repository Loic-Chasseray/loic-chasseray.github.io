<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Demo</title>
        <link rel="stylesheet" href="styles.css">
        <!-- Load Plotly -->
        <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
        <!-- Load PapaParse -->
        <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    </head>
    <body>
        <h1>Rainfall</h1>
        <p>This page displays data from my repo "Rainfall Data Collector".</p>
        <hr>
        <!-- https://raw.githubusercontent.com/Loic-Chasseray/Rainfall-Data-Collector/refs/heads/main/master.csv -->
        <!-- consider putting this css into styles.css -->
        <div id="chart" style="width: 90%; height: 500px;"></div>
        <script>
            const url = "https://raw.githubusercontent.com/Loic-Chasseray/Rainfall-Data-Collector/refs/heads/main/master.csv"
            fetch(url)
                .then(response => response.text())
                .then(csvText => 
                    {
                        const parsed = Papa.parse(csvText, { header: true }).data;
                        const timestamp = parsed.map(row => row["Timestamp (UTC)"]);
                        const rainfall = parsed.map(row => row["Rainfall (mm)"]);
                        Plotly.newPlot
                            (
                                "chart",
                                [{
                                    x: timestamp,
                                    y: rainfall,
                                    type: "bar"
                                }],
                                {
                                    title: "Rainfall at Hogsmill Gauge"
                                }
                            );
                    });
        </script>
    </body>
</html>
